name: SMS Podsetnici za rokove
# Night sprint T08 (2026-10-17): automatsko pokretanje ISKLJUČENO. Zakazani posao je od 2026-10-12 svaki dan
# dobijao 401 (ruta prima samo osnivačev JWT, ne CRON_TOKEN), a produkcioni `/sms/status` je prijavio da
# provider nije konfigurisan — SMS isporuka NIJE operativna. Ponovno uključivanje (vratiti `schedule:` ispod)
# traži odluku osnivača o autorizaciji SMS rute i potvrdu Twilio konfiguracije. `workflow_dispatch` ostaje
# samo za budući kontrolisani ručni test.
on:
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      # VCR002 T04: dokazano 2026-10-11 (run 38144992944) — server odgovara 401 „Vaša sesija je istekla“, jer
      # /sms/send-reminders prima SAMO osnivačev JWT (routers/sms.py), a ne CRON_TOKEN; goli `curl` bez provere
      # statusa je to prikazivao kao uspeh. Isti kvar kao email-cron.yml pre Wave 4. Ovde se SAMO prestaje sa
      # lažnim uspehom: prihvatanje cron ključa na SMS ruti bi uključilo slanje SMS-a stvarnim korisnicima, a to je
      # zasebna odluka osnivača (VCR002_RELEASE_HANDOFF.md).
      - name: Pošalji SMS podsetnike
        run: |
          http_code=$(curl -s -o /tmp/sms_cron_response.json -w "%{http_code}" -X POST https://vindex.rs/sms/send-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "HTTP $http_code"
          cat /tmp/sms_cron_response.json
          echo ""
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::sms/send-reminders returned HTTP $http_code -- treating as job failure, not silent success."
            exit 1
          fi
