name: NS2 OCR gunicorn 512 MiB measurement

# Measurement-only branch (Night Sprint II, B1/B2). Never merged.
# PRODUCTION Dockerfile image, started with the production start command shape `gunicorn ... -c gunicorn.conf.py`,
# one fresh `--memory=512m --memory-swap=512m` container per case, memory sampled from the host cgroup.
# Fixtures are synthetic (generated in the job); results contain only sizes, hashes, timings and CER.

on:
  push:
    branches: [measure/ns2-ocr-cgroup]
  workflow_dispatch:

jobs:
  b1:
    if: ${{ !contains(github.event.head_commit.message, '[b2-only]') && !contains(github.event.head_commit.message, '[skip-b1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        run: [r1, r2, r3]
    steps:
      - uses: actions/checkout@v4
      - name: Runner facts
        run: |
          nproc; free -m; uname -r
          echo "cgroup fs: $(stat -fc %T /sys/fs/cgroup)"; docker info --format '{{.CgroupDriver}} {{.CgroupVersion}}'
      - name: Build the production image (Dockerfile)
        run: docker build -q -t vx .
      - name: Image facts
        run: docker run --rm vx sh -c "python -V; gunicorn --version; tesseract --version 2>&1 | head -n 1; tesseract --list-langs 2>&1 | tr '\n' ' '"
      - name: Generate synthetic fixtures
        run: docker run --rm -v "$PWD/ns2_measure:/m" vx python /m/gen.py /m/fx
      - name: B1 cases (gunicorn, 512 MiB)
        run: bash ns2_measure/run_b1.sh ns2_measure/cases_b1.txt ${{ matrix.run }}
      - name: Summary
        if: always()
        run: |
          python3 ns2_measure/summarize.py
          echo "NS2ROWS_BEGIN"; python3 -c "import json; [print('NS2ROW', json.dumps(r, ensure_ascii=False)) for r in json.load(open('ns2_measure/out/summary_rows.json'))]"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns2-b1-${{ matrix.run }}
          path: |
            ns2_measure/out/*.json
            ns2_measure/logs/*.log
          retention-days: 14

  b2:
    if: ${{ contains(github.event.head_commit.message, '[b2]') || contains(github.event.head_commit.message, '[b2-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (Dockerfile)
        run: docker build -q -t vx .
      - name: Generate B2 fixtures
        run: docker run --rm -v "$PWD/ns2_measure:/m" vx python /m/gen_b2.py /m/fxb2
      - name: B2 probe - base extractor (942b2053) vs candidate (NS2 B2)
        run: |
          for v in base cand; do
            cmd="cd /app && python /m/b2probe.py /m/fxb2"
            [ "$v" = cand ] && cmd="cp /m/variants/extractor_b2.py /app/uploaded_doc/extractor.py && $cmd"
            echo "=== B2PROBE $v"
            docker run --rm --env-file ns2_measure/env.list -e FIELD_ENCRYPTION_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))") \
              -e PYTHONIOENCODING=utf-8 -v "$PWD/ns2_measure:/m" vx sh -c "$cmd" 2>/dev/null | grep '^{' | sed "s/^/B2PROBE $v /"
          done
      - name: B2 discriminator sweep (production tessdata)
        run: |
          docker run --rm -e PYTHONIOENCODING=utf-8 -v "$PWD/ns2_measure:/m" vx sh -c "cd /app && python /m/b2sweep.py /m /m/fxb2s" 2>/dev/null | grep '^{"kind' | sed 's/^/B2SWEEP /'

  ret:
    if: ${{ contains(github.event.head_commit.message, '[ret]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (Dockerfile)
        run: docker build -q -t vx .
      - name: Generate synthetic fixtures
        run: docker run --rm -v "$PWD/ns2_measure:/m" vx python /m/gen.py /m/fx > /dev/null
      - name: Retention probe (no cgroup limit, 2 GiB) - which memory stays after each job
        run: |
          FEK=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          SEQ=scan_cyr_1p.pdf,scan_cyr_1p.pdf,mixed_6p.pdf,img_40mp_cmyk.jpg,img_40mp_cmyk.jpg,photo_48mp_a4.pdf,img_40mp.png,page_a0.pdf,pdf_flate100_a4.pdf,img_40mp_prog444.jpg,scan_10p.pdf,img_40mp_prog444.jpg,scan_cyr_1p.pdf
          while read -r tag envs; do
            [ -z "$tag" ] && continue
            e=""; for kv in $(echo "$envs" | tr ',' ' '); do [ "$kv" != "-" ] && e="$e -e $kv"; done
            echo "=== RETCASE $tag $envs"
            docker run --rm --memory=2g $e --env-file ns2_measure/env.list -e FIELD_ENCRYPTION_KEY=$FEK -v "$PWD/ns2_measure:/m" vx               python /m/ret.py $SEQ 2>&1 | grep -E "^RET" | sed "s/^/$tag /"
          done < ns2_measure/ret_cases.txt
