name: Security Checks

# CELINA 5 (2026-07-24): Secret scanning + SAST + dependency-vulnerability
# scanning, per docs/security/STRIDE_THREAT_MODEL.md §7 and
# docs/security/SECURITY_GAP_REGISTER.md (SEC-036 CI/CD security gap).
#
# Enforcement policy (deliberate, not an oversight):
#   - secret-scan   : BLOCKING. The comment here used to read "No accepted baseline
#                     for secrets — any hit is real." That was false and it is why
#                     this job stayed red and unread: the full-history scan
#                     (fetch-depth: 0) returns 888 findings, of which 887 are noise
#                     — 875 are a Drupal `theme_token` from the Supreme Court's own
#                     public website, captured verbatim by the scraper into data/.
#                     A job that can never be green teaches everyone to ignore it.
#                     Noise is now removed by path allowlist in .gitleaks.toml, and
#                     individually-justified findings by fingerprint in
#                     .gitleaksignore. Every entry there needs a written reason, and
#                     adding one to make the build green is a misuse of the file.
#                     As of 2026-08-08 exactly ONE finding remains unsuppressed and
#                     this job is red for it alone: a real OpenAI key committed in
#                     the first commit of a PUBLIC repo. See .gitleaksignore.
#   - sast-core     : BLOCKING, but scoped to live request-serving code
#                     (api.py, main.py, routers/, shared/, security/, services/,
#                     app/) and only on HIGH severity. A full bandit sweep of the
#                     whole repo (incl. one-off scripts/ ingestion tools) currently
#                     has ~35 pre-existing MEDIUM findings (mostly B310 url-scheme-
#                     audit and MD5-as-cache-key false positives) that have not all
#                     been triaged yet — blocking on those today would break CI for
#                     the whole team without warning. sast-full below tracks them
#                     visibly instead. Tighten this job's scope over time as the
#                     MEDIUM backlog is triaged (see sast-full artifact).
#   - sast-full     : INFORMATIONAL. Whole-repo bandit sweep, never fails the build,
#                     uploads a JSON artifact for review.
#   - dependency-scan: BLOCKING via pip-audit, with one documented exception:
#                     PYSEC-2026-1325 (python-ecdsa timing side-channel) has no
#                     upstream fix — it's a known, long-standing limitation of pure-
#                     Python ECDSA (transitively pulled in by python-jose) and is
#                     accepted as low-practical-risk (remote timing exploitation is
#                     not realistic here). Re-evaluate if python-jose ever drops the
#                     ecdsa backend entirely.
#
# SECURITY & PRODUCTION SPRINT — Opcija A (2026-07-26): added semgrep-core/
# semgrep-full, same core/full split as bandit above, same rationale:
#   - semgrep-core: BLOCKING, scoped to live request-serving code, ERROR
#                     severity only (p/security-audit + p/python rulesets, no
#                     Semgrep account/token required for these public registry
#                     configs). Verified 0 findings at this scope/severity as
#                     of 2026-07-26 (one real hit, a dead `import
#                     xml.etree.ElementTree` in routers/sef.py's _find()
#                     helper that Semgrep's use-defused-xml rule flagged —
#                     the import was never referenced, the actual XML parse
#                     already goes through lxml's default-safe parser or
#                     defusedxml.ElementTree; removed as dead code, not a
#                     real XXE exposure). Safe to start BLOCKING immediately.
#   - semgrep-full  : INFORMATIONAL. Whole-repo sweep (all severities, wider
#                     rule set), never fails the build, uploads a JSON
#                     artifact for review — same pattern as sast-full.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks auto-discovers .gitleaks.toml from the source root, but
          # the action is more predictable when told. .gitleaksignore is read
          # from the root automatically.
          GITLEAKS_CONFIG: .gitleaks.toml

  sast-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit — live request-path code (HIGH severity, blocking)
        run: |
          bandit -r api.py main.py routers/ shared/ security/ services/ app/ \
            -lll -iii -f txt

  sast-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit — full repo sweep (informational, never blocks)
        run: |
          bandit -r . \
            --exclude ./tests,./migrations,./data,./vindex_scraper_output,./.git \
            -f json -o bandit-full-report.json || true
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-full-report
          path: bandit-full-report.json

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit — dependency vulnerabilities (blocking, 1 documented exception)
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-1325

  semgrep-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep — live request-path code (ERROR severity, blocking)
        run: |
          semgrep scan --config=p/security-audit --config=p/python \
            --severity=ERROR --error \
            api.py main.py routers/ shared/ security/ services/ app/

  semgrep-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep — full repo sweep (informational, never blocks)
        run: |
          semgrep scan --config=p/security-audit --config=p/python \
            --exclude=tests --exclude=migrations --exclude=data --exclude=vindex_scraper_output \
            --json --output=semgrep-full-report.json . || true
      - name: Upload semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-full-report
          path: semgrep-full-report.json
