name: Production Runtime Parity

# WHY THIS WORKFLOW EXISTS
#
# On 2026-08-08 production went fully down: gunicorn workers exited 3 in a
# crash loop and no HTTP port ever opened, because routers/hearing_cc.py
# contained a backslash inside an f-string expression. That is legal on
# Python 3.12+ (PEP 701) and a SyntaxError on 3.11.
#
#   local dev + CI : Python 3.13  -> parsed fine, 3,500 tests green
#   production     : python:3.11-slim (Dockerfile) -> could not IMPORT the app
#
# The gap was never test coverage. Nothing ever compiled the code on the
# interpreter production actually runs. These jobs close that: they execute
# on the REAL production runtime, not on a heuristic.
#
# tests/test_python311_production_compat.py stays as defence-in-depth (it
# runs on every developer machine), but it can only catch patterns someone
# thought to encode. These jobs catch the class.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # GATE 1 — the fast, always-run compile gate.
  # Runs INSIDE python:3.11-slim, the exact base image the Dockerfile uses.
  # No dependencies installed: a SyntaxError is a compile-time failure and
  # needs nothing but the interpreter, so this gate is seconds, not minutes,
  # and cannot be skipped for being slow.
  # ───────────────────────────────────────────────────────────────────────
  compile-on-production-python:
    name: Byte-compile on production Python (3.11)
    runs-on: ubuntu-latest
    container: python:3.11-slim
    steps:
      - uses: actions/checkout@v4

      - name: Confirm we are actually on the production interpreter
        run: |
          python -V
          python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version; print('OK: running Python 3.11')"

      - name: Byte-compile every module (this is what production does on import)
        run: |
          python -m compileall -q -f \
            -x '(^|/)(\.venv|venv|node_modules|data|vindex_scraper_output|\.git)/' \
            . 2>&1 | tee /tmp/compile.log
          if grep -qiE "error|Sorry" /tmp/compile.log; then
            echo "::error::Byte-compilation failed on Python 3.11 — production would not boot"
            cat /tmp/compile.log
            exit 1
          fi
          echo "OK: every module compiles on the production interpreter"

      # PROOF THAT THIS GATE ACTUALLY WORKS.
      # A gate nobody has seen fail is not a gate. This compiles the exact
      # construct that took production down and REQUIRES it to fail. If a
      # future Python makes it legal, or the step silently stops running,
      # this fails loudly instead of going quietly green.
      - name: Prove the gate detects the 2026-08-08 incident
        run: |
          cp tests/fixtures/py311_incident_canary.txt /tmp/canary.py
          if python -m py_compile /tmp/canary.py 2>/tmp/canary.err; then
            echo "::error::CANARY COMPILED — this gate can no longer detect the incident it exists for"
            exit 1
          fi
          if ! grep -q "backslash" /tmp/canary.err; then
            echo "::error::Canary failed for the WRONG reason:"
            cat /tmp/canary.err
            exit 1
          fi
          echo "OK: gate correctly rejects the historical incident:"
          cat /tmp/canary.err

  # ───────────────────────────────────────────────────────────────────────
  # GATE 2 — real imports + full suite on the production interpreter.
  # A module can compile and still fail to IMPORT (bad dependency pin,
  # removed stdlib API, C-extension incompatibility). Only an actual import
  # of api:app proves what gunicorn does at boot.
  # ───────────────────────────────────────────────────────────────────────
  import-and-test-on-production-python:
    name: Import app + full suite on production Python (3.11)
    runs-on: ubuntu-latest
    container: python:3.11-slim
    env:
      SUPABASE_URL: https://fake.supabase.co
      SUPABASE_ANON_KEY: fake-anon-key
      SUPABASE_SERVICE_KEY: fake-service-key
      SUPABASE_JWT_SECRET: fake-jwt-secret-longer-than-32-chars-ok
      OPENAI_API_KEY: sk-fake
      PINECONE_API_KEY: fake-pinecone
      PINECONE_HOST: https://fake.pinecone.io
      # NOTE: FOUNDER_EMAILS is deliberately NOT set at job level. A job-level
      # value wins over tests/conftest.py's setdefault(), and 13 tests assert
      # founder-only behaviour against specific addresses. conftest owns that
      # value for anything running under pytest; the bare-import step below,
      # which never loads conftest, sets its own.
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: System packages the Dockerfile also installs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc g++ tesseract-ocr poppler-utils
          rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import the ASGI app exactly as gunicorn does
        env:
          # shared/deps.py raises at import time when this is unset, and no
          # conftest is loaded here — this is a bare interpreter, like gunicorn.
          FOUNDER_EMAILS: ci@example.com
        run: |
          python -c "import api; assert hasattr(api, 'app'); print('OK: api:app imported on Python 3.11')"

      # NS005 Gate B: stvaran Tesseract u ovom poslu (tesseract-ocr bez srpskog paketa) —
      # dokazuje A–D i STVARNO stanje „bez srpskog paketa“ (E). Nedostatak OCR-a je PAD,
      # ne preskok (VINDEX_REQUIRE_OCR=1). Rezultati izlaze kao anotacije (javno čitljive).
      - name: OCR proof (real Tesseract, no Serbian pack)
        env:
          VINDEX_REQUIRE_OCR: "1"
          VINDEX_OCR_REPORT: /tmp/ocr-py311.json
        shell: bash
        run: |
          set -o pipefail
          # `python -m pytest` (ne gol `pytest`): stavlja koren repoa na sys.path, kao u koraku u produkcionoj slici.
          python -m pytest tests/test_ns005_b_ocr.py tests/test_ns005_t14_smart_intake.py -q -rs -p no:randomly -p no:cacheprovider 2>&1 | tee /tmp/ocr-py311.log

      - name: OCR proof report (py311)
        if: always()
        shell: bash
        run: |
          izvestaj() {
          python - "$1" "$2" <<'PY'
          import json, sys
          put, oznaka = sys.argv[1], sys.argv[2]
          try:
              d = json.load(open(put, encoding="utf-8"))
          except Exception as e:
              print(f"::error title=OCR {oznaka}::izveštaj nije napisan ({type(e).__name__})")
              sys.exit(0)
          j = d.pop("jezici", [])
          print(f"::notice title=OCR {oznaka} jezici::{len(j)} paketa; srp={'srp' in j}; srp_latn={'srp_latn' in j}")
          for k, v in d.items():
              print(f"::notice title=OCR {oznaka} {k}::" + json.dumps(v, ensure_ascii=False))
          PY
          }
          izvestaj /tmp/ocr-py311.json py311
          if [ -f /tmp/ocr-py311.log ]; then
            # Logovi poslova nisu javni: poslednje linije pytest izlaza kao anotacija (okruženje ima samo lažne ključeve).
            { printf "::notice title=OCR py311 pytest izlaz::"; tail -n 40 /tmp/ocr-py311.log | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}'; echo; }
          fi

      - name: Full test suite on the production interpreter
        # -rs: report SKIPPED with reasons. Without it the 59 real-PostgreSQL
        # tests covering migrations 107 and 108 -- the credit-race closure the
        # Beta GO was made conditional on -- collapse into a row of bare 's'
        # characters, and CI reports green having verified none of them. The
        # skip conditions are honest; their invisibility was the defect.
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ -q -rfEs 2>&1 | tee /tmp/full-suite.log

      # Logovi poslova nisu javni: zbirna linija i poslednji padovi kao anotacija — dokaz da je
      # pytest prošao sakupljanje i izvršio testove (ne „Interrupted: N errors during collection“).
      - name: Full test suite summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/full-suite.log ]; then
            { printf "::notice title=Full suite::"; grep -E "^(FAILED|ERROR) |Interrupted|passed|failed" /tmp/full-suite.log | tail -n 40 | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}'; echo; }
          fi

  # ───────────────────────────────────────────────────────────────────────
  # GATE 3 — the real production build path.
  # Gates 1 and 2 use the same BASE image; this builds the actual Dockerfile
  # Render builds, then compiles and imports inside the resulting image. It
  # catches anything the Dockerfile itself introduces (missing system libs,
  # COPY/layer ordering, a dependency that only breaks in the final image).
  # ───────────────────────────────────────────────────────────────────────
  production-docker-build:
    name: Build production image and boot-check it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t vindex-prod-check:ci .

      - name: Byte-compile inside the production image
        run: |
          docker run --rm vindex-prod-check:ci \
            python -m compileall -q -f \
              -x '(^|/)(\.venv|venv|node_modules|data|vindex_scraper_output|\.git)/' /app

      - name: Import api:app inside the production image
        run: |
          docker run --rm \
            -e SUPABASE_URL=https://fake.supabase.co \
            -e SUPABASE_ANON_KEY=fake-anon-key \
            -e SUPABASE_SERVICE_KEY=fake-service-key \
            -e SUPABASE_JWT_SECRET=fake-jwt-secret-longer-than-32-chars-ok \
            -e OPENAI_API_KEY=sk-fake \
            -e PINECONE_API_KEY=fake-pinecone \
            -e PINECONE_HOST=https://fake.pinecone.io \
            -e FOUNDER_EMAILS=ci@example.com \
            -e FIELD_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            vindex-prod-check:ci \
            python -c "import api; assert hasattr(api,'app'); print('OK: api:app imports inside the production image')"

      # NS005 Gate B: OCR u STVARNOJ produkcionoj slici (isti Dockerfile, isti tesseract-ocr,
      # poppler-utils i srpski paketi kao Render). Srpski latinični paket je OBAVEZAN ovde.
      - name: OCR proof inside the production image (Serbian packs required)
        # FIELD_ENCRYPTION_KEY se NE prosleđuje: tests/conftest.py postavlja test-ključ pre svakog importa
        # (doslovna vrednost u ovom koraku je bila gitleaks generic-api-key nalaz u commitu 34a21535).
        run: |
          mkdir -p "$RUNNER_TEMP/ocr"
          docker run --rm \
            -e SUPABASE_URL=https://fake.supabase.co \
            -e SUPABASE_ANON_KEY=fake-anon-key \
            -e SUPABASE_SERVICE_KEY=fake-service-key \
            -e SUPABASE_JWT_SECRET=fake-jwt-secret-longer-than-32-chars-ok \
            -e OPENAI_API_KEY=sk-fake \
            -e PINECONE_API_KEY=fake-pinecone \
            -e PINECONE_HOST=https://fake.pinecone.io \
            -e FOUNDER_EMAILS=ci@example.com \
            -e VINDEX_REQUIRE_OCR=1 -e VINDEX_EXPECT_SRP=1 -e VINDEX_OCR_REPORT=/out/ocr-image.json \
            -v "$RUNNER_TEMP/ocr:/out" \
            vindex-prod-check:ci \
            python -m pytest tests/test_ns005_b_ocr.py tests/test_ns005_t14_smart_intake.py -q -rs -p no:randomly -p no:cacheprovider

      - name: OCR proof report (production image)
        if: always()
        shell: bash
        run: |
          izvestaj() {
          python - "$1" "$2" <<'PY'
          import json, sys
          put, oznaka = sys.argv[1], sys.argv[2]
          try:
              d = json.load(open(put, encoding="utf-8"))
          except Exception as e:
              print(f"::error title=OCR {oznaka}::izveštaj nije napisan ({type(e).__name__})")
              sys.exit(0)
          j = d.pop("jezici", [])
          print(f"::notice title=OCR {oznaka} jezici::{len(j)} paketa; srp={'srp' in j}; srp_latn={'srp_latn' in j}")
          for k, v in d.items():
              print(f"::notice title=OCR {oznaka} {k}::" + json.dumps(v, ensure_ascii=False))
          PY
          }
          izvestaj "$RUNNER_TEMP/ocr/ocr-image.json" image

      - name: Confirm the image really is Python 3.11
        run: |
          docker run --rm vindex-prod-check:ci python -c "import sys; assert sys.version_info[:2]==(3,11), sys.version; print('OK', sys.version.split()[0])"
