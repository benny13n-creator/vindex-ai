name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    # PROD PARITY (2026-08-08, incident PROD-SYNTAX-001): this job used to run
    # ONLY on 3.13. Production is python:3.11-slim, so a construct that is
    # legal on 3.12+ and a SyntaxError on 3.11 passed CI and then took
    # production down. 3.11 is now the primary, production-matching target;
    # 3.13 is kept because that is what developers run locally, so a
    # regression in either direction is caught.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # Fake credentials — the test suite mocks Supabase/OpenAI/Pinecone throughout
      # and does not hit live services. Real secrets are never needed here.
      SUPABASE_URL: https://fake.supabase.co
      SUPABASE_ANON_KEY: fake-anon-key
      SUPABASE_SERVICE_KEY: fake-service-key
      SUPABASE_JWT_SECRET: fake-jwt-secret-longer-than-32-chars-ok
      OPENAI_API_KEY: sk-fake
      PINECONE_API_KEY: fake-pinecone
      PINECONE_HOST: https://fake.pinecone.io
      # CI-RED-001: shared/deps.py raises RuntimeError at IMPORT time without
      # FOUNDER_EMAILS, so collection failed and this workflow had been red on
      # every commit for its entire visible history. tests/conftest.py now
      # setdefault()s it, which is why it is NOT set here: a job-level value
      # would win over conftest, and 13 tests assert founder-only behaviour
      # against specific addresses. One owner for that value — conftest.
      FIELD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        # -rs: report SKIPPED with reasons. Without it the 59 real-PostgreSQL
        # tests covering migrations 107 and 108 -- the credit-race closure the
        # Beta GO was made conditional on -- collapse into a row of bare 's'
        # characters, and CI reports green having verified none of them. The
        # skip conditions are honest; their invisibility was the defect.
        run: pytest tests/ -q -rs
