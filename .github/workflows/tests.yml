name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    # PROD PARITY (2026-08-08, incident PROD-SYNTAX-001): this job used to run
    # ONLY on 3.13. Production is python:3.11-slim, so a construct that is
    # legal on 3.12+ and a SyntaxError on 3.11 passed CI and then took
    # production down. 3.11 is now the primary, production-matching target;
    # 3.13 is kept because that is what developers run locally, so a
    # regression in either direction is caught.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    name: pytest (Python ${{ matrix.python-version }})
    # ubuntu-latest = ubuntu-26.04 od slike 20261025: `playwright install --with-deps chromium` (requirements-browser.txt)
    # tamo pada pre ijednog testa ("Playwright does not support chromium on ubuntu26.04-x64"). Fiksna podržana slika.
    runs-on: ubuntu-24.04
    env:
      # Fake credentials — the test suite mocks Supabase/OpenAI/Pinecone throughout
      # and does not hit live services. Real secrets are never needed here.
      SUPABASE_URL: https://fake.supabase.co
      SUPABASE_ANON_KEY: fake-anon-key
      SUPABASE_SERVICE_KEY: fake-service-key
      SUPABASE_JWT_SECRET: fake-jwt-secret-longer-than-32-chars-ok
      OPENAI_API_KEY: sk-fake
      PINECONE_API_KEY: fake-pinecone
      PINECONE_HOST: https://fake.pinecone.io
      # CI-RED-001: shared/deps.py raises RuntimeError at IMPORT time without
      # FOUNDER_EMAILS, so collection failed and this workflow had been red on
      # every commit for its entire visible history. tests/conftest.py now
      # setdefault()s it, which is why it is NOT set here: a job-level value
      # would win over conftest, and 13 tests assert founder-only behaviour
      # against specific addresses. One owner for that value — conftest.
      FIELD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4
        with:
          # NS3-N02: full history. tests/test_faza661_rollout_compatibility.py and
          # tests/test_wave11_release_identity.py read historical commits via
          # `git show`; a depth-1 clone failed 14 of them and skipped 3.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Izolovan TEST PostgreSQL kroz kanonski scripts/test_db.py (loopback, sistemski temp, --auth=trust samo na
      # 127.0.0.1) i fail-closed `verify` PRE testova. Bez ovoga su dokazi nad pravom bazom (naplata, migracije,
      # NS4 G1/G2/O1/O3) bili preskočeni. Binarni fajlovi su na runner-u van PATH-a; socket direktorijum
      # /var/run/postgresql pripada korisniku postgres, pa ga runner dobija samo za ovaj efemerni posao.
      - name: Isolated test PostgreSQL (scripts/test_db.py up + verify)
        shell: bash
        run: |
          VINDEX_PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          echo "VINDEX_PG_BIN=$VINDEX_PG_BIN" >> "$GITHUB_ENV"
          export VINDEX_PG_BIN
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/run/postgresql
          python scripts/test_db.py up
          python scripts/test_db.py verify
          echo "VINDEX_PG_TEST_DSN=postgresql://postgres@127.0.0.1:55433/postgres" >> "$GITHUB_ENV"

      # Merenje vidljive veličine teksta legacy interfejsa (tests/test_faza1_izvor_pod.py) traži Chromium.
      # Playwright ide u ZASEBAN venv: test ga poziva kao poseban proces, pa ostali Playwright testovi ne menjaju
      # stanje (bez pregledača se i dalje preskaču kao do sada). Nedostupan pregledač je PAD testa, ne preskok.
      - name: Isolated browser for the legacy text-size measurement (Playwright venv)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install -q -r requirements-browser.txt
          "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium
          echo "VINDEX_PLAYWRIGHT_PYTHON=$RUNNER_TEMP/pw/bin/python" >> "$GITHUB_ENV"

      - name: Run pytest
        # -rs: report SKIPPED with reasons. Without it the 59 real-PostgreSQL
        # tests covering migrations 107 and 108 -- the credit-race closure the
        # Beta GO was made conditional on -- collapse into a row of bare 's'
        # characters, and CI reports green having verified none of them. The
        # skip conditions are honest; their invisibility was the defect.
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ -q -rfEs 2>&1 | tee /tmp/full-suite.log

      # Logovi poslova nisu javni: SVA imena padova (bez poruka) kao anotacije u delovima ≤ 3.5 KB,
      # da bi se mogla tačno uporediti sa osnovom na `main`.
      - name: Failure names
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/full-suite.log ]; then
            grep -aE "^(FAILED|ERROR) " /tmp/full-suite.log | sed -E 's/ - .*//' | sort -u > /tmp/failure-names.txt || true
            echo "::notice title=Failure count (py${{ matrix.python-version }})::$(wc -l < /tmp/failure-names.txt) | $(grep -aE '[0-9]+ (passed|failed)' /tmp/full-suite.log | tail -n 1)"
            awk -v oz="py${{ matrix.python-version }}" 'BEGIN{d=0; n=1} { l=$0; gsub(/%/,"%25",l); if (d + length(l) > 3500) { print "::notice title=Failure names " oz " #" n "::" buf; buf=""; d=0; n++ } buf = buf l "%0A"; d += length(l) + 3 } END { if (buf != "") print "::notice title=Failure names " oz " #" n "::" buf }' /tmp/failure-names.txt
          fi
